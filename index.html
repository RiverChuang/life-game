<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf6ea">
  <meta name="description" content="人生遊戲：從 3 到 99 歲，每週自己安排，自己的人生自己決定。">
  <title>人生遊戲</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="人生遊戲">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

<body>

  <!-- 遊戲引擎與資料 -->
  <script src="js/engine.js"></script>

  <script src="js/shop.js"></script>

  <script src="js/events/e12_mid.js"></script>
  <script src="js/events/e13_late.js"></script>

  <script src="js/art.js"></script>
  <script src="js/town.js"></script>
  <script src="js/music.js"></script>
  <script src="js/save.js"></script>
  <script src="js/ui.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>

</html>
